[project]
name = "backend-kit"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.20",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = [
    "packages/fastapi-runtime/tests",
    "packages/pg-test-db/tests",
    "packages/typed-result/tests",
]
addopts = [
    "--cov=fastapi_runtime",
    "--cov=pg_test_db",
    "--cov=typed_result",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.ruff]
target-version = "py314"
src = [
    "packages/fastapi-runtime/src",
    "packages/fastapi-runtime/tests",
    "packages/pg-test-db/src",
    "packages/pg-test-db/tests",
    "packages/typed-result/src",
    "packages/typed-result/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["packages/*/src", "packages/*/tests"]
strict = ["packages/*/src", "packages/*/tests"]
reportImplicitOverride = true
reportDeprecated = true
reportUnnecessaryTypeIgnoreComment = true
reportUnknownMemberType = true
reportUnknownVariableType = true
reportUnknownArgumentType = true
reportUnknownLambdaType = true
reportUnknownParameterType = true
