name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@v8.3.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: .python-version

      - run: uv sync --locked --all-packages

      - run: uv run ruff format --check .

      - run: uv run ruff check .

      - run: uv run pyright

      - run: >-
          uv run pytest
          packages/fastapi-runtime/tests
          packages/pg-test-db/tests
          packages/typed-result/tests
          --db-url postgresql+psycopg://postgres:postgres@localhost:5432/

      - run: uv build --all-packages

  fastapi-compatibility:
    name: FastAPI ${{ matrix.fastapi }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - fastapi: minimum
            requirement: fastapi==0.133.1
          - fastapi: latest
            requirement: fastapi

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@v8.3.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version-file: .python-version

      - run: >-
          uv run --isolated
          --all-packages
          --with '${{ matrix.requirement }}'
          pytest
          -c packages/fastapi-runtime/pyproject.toml
          packages/fastapi-runtime/tests
